minimum_prek_version: "0.5.11"
repos:
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        language: system
        types: [go]
        entry: go run mvdan.cc/gofumpt@v0.12.0 -w
      - id: goimports
        name: goimports
        language: system
        types: [go]
        entry: go run golang.org/x/tools/cmd/goimports@v0.52.0 -w
      - id: golangci-lint
        name: golangci-lint
        language: system
        pass_filenames: false
        entry: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --timeout=5m
      - id: actionlint
        name: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
        entry: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
